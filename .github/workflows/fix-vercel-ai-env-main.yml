name: Fix invalid Vercel AI env on main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-vercel-ai-env-main.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove invalid Vercel env variable
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = {
              Path('.env.example'): 'VERCEL_AI_GATEWAY_URL=\n',
              Path('lib/env.ts'): '  VERCEL_AI_GATEWAY_URL: z.string().optional().default(""),\n',
          }
          for path, needle in targets.items():
              text = path.read_text()
              if needle in text:
                  path.write_text(text.replace(needle, ''))
                  print(f'Updated {path}')
              else:
                  print(f'Already clean: {path}')
          PY
          if grep -n "VERCEL_AI_GATEWAY_URL" .env.example lib/env.ts; then
            echo "VERCEL_AI_GATEWAY_URL still exists"
            exit 1
          fi
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- .env.example lib/env.ts; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example lib/env.ts
          git commit -m "fix(vercel): remove invalid AI Gateway env variable"
          git push origin HEAD:main
