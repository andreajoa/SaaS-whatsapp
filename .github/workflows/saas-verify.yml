name: SaaS Whatsapp verification

on:
  push:
    branches:
      - feat/saas-cloud-scale

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Channel provider leak
        run: pnpm lint:channels
      - name: Unit tests
        run: pnpm test:unit
      - name: Shell/self-host tests
        run: pnpm test:shell
      - name: Production build
        run: pnpm build

  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5
      - name: RLS isolation + governance invariants
        run: pnpm test:db
