# Worker contínuo da Atenza, na VM Google já existente junto ao WAHA.
# Coloque o .env privado no mesmo diretório deste arquivo e fixe WORKER_IMAGE
# no digest da imagem publicada a partir da mesma revisão do app.
services:
  worker:
    image: ${WORKER_IMAGE:?defina a imagem do worker da mesma revisao do app}
    pull_policy: ${WORKER_PULL_POLICY:-missing}
    restart: unless-stopped
    env_file: .env
    environment:
      SAAS_BILLING_REQUIRED: "1"
      QUEUE_MAX_CONCURRENCY: "1"
      DB_POOL_MAX: "3"
      NODE_OPTIONS: "--max-old-space-size=256"
      FLYWHEEL_INTERVAL_MS: "0"
    mem_limit: 384m
    memswap_limit: 768m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
